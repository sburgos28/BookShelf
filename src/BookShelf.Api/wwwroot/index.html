<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookShelf — Biblioteca personal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Cabecera: identidad de la app y enlace a Swagger. -->
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
        <rect width="42" height="42" rx="12" fill="#8b5e3c"></rect>
        <path d="M12 11h8a5 5 0 0 1 5 5v15h-8a5 5 0 0 1-5-5V11Z" fill="#fff" opacity=".95"></path>
        <path d="M30 11h-5a5 5 0 0 0-5 5v15h5a5 5 0 0 0 5-5V11Z" fill="#fff" opacity=".7"></path>
      </svg>
      <div>
        <h1>BookShelf</h1>
        <p>Tu biblioteca personal</p>
      </div>
    </div>
    <a class="docs-link" href="/swagger" target="_blank" rel="noreferrer">
      Documentación API <span aria-hidden="true">↗</span>
    </a>
  </header>

  <main class="layout">
    <section class="panel form-panel" aria-labelledby="form-title">
      <div class="panel-heading">
        <h2 id="form-title">Añadir libro</h2>
        <p>Los campos con <span class="required">*</span> son obligatorios.</p>
      </div>

      <!-- El mismo formulario se usa para crear y editar. -->
      <form id="book-form">
        <div class="form-grid">
          <label class="field field-wide">
            <span>Título <span class="required">*</span></span>
            <input name="title" type="text" maxlength="200" required placeholder="Dune">
          </label>

          <label class="field field-wide">
            <span>Autor <span class="required">*</span></span>
            <input name="author" type="text" maxlength="150" required placeholder="Frank Herbert">
          </label>

          <label class="field">
            <span>Género</span>
            <input name="genre" type="text" maxlength="100" placeholder="Ciencia ficción">
          </label>

          <label class="field">
            <span>Año de publicación <span class="required">*</span></span>
            <input name="publicationYear" type="number" min="1" required placeholder="1965">
          </label>

          <label class="field">
            <span>Estado <span class="required">*</span></span>
            <select name="readingStatus" required>
              <option value="Pending">Pendiente</option>
              <option value="Reading">Leyendo</option>
              <option value="Read">Leído</option>
            </select>
          </label>

          <label class="field">
            <span>Valoración</span>
            <select name="rating">
              <option value="">Sin valorar</option>
              <option value="1">1 ★</option>
              <option value="2">2 ★★</option>
              <option value="3">3 ★★★</option>
              <option value="4">4 ★★★★</option>
              <option value="5">5 ★★★★★</option>
            </select>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="button" id="submit-button">Añadir libro</button>
          <button type="button" class="button button-ghost" id="cancel-button" hidden>Cancelar</button>
        </div>
      </form>

      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    </section>

    <section class="panel list-panel" aria-labelledby="list-title">
      <div class="panel-heading list-heading">
        <div>
          <h2 id="list-title">Mis libros</h2>
          <p id="book-count">Cargando…</p>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th scope="col">Título</th>
              <th scope="col">Autor</th>
              <th scope="col">Género</th>
              <th scope="col">Año</th>
              <th scope="col">Estado</th>
              <th scope="col">Valoración</th>
              <th scope="col"><span class="sr-only">Acciones</span></th>
            </tr>
          </thead>
          <!-- JavaScript rellena este tbody con los libros de la API. -->
          <tbody id="books-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span>BookShelf · ASP.NET Core + MySQL</span>
    <a href="/swagger" target="_blank" rel="noreferrer">Swagger</a>
  </footer>
</body>
</html>
